<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso aree test · Sevcon</title>
<link rel="icon" href="logo.png">
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--line:#263750;--text:#edf4ff;--muted:#9aabc2;--accent:#72b7ff;--good:#77e0b0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#183b61 0,transparent 42%),radial-gradient(ellipse at 90% 85%,#27204c 0,transparent 38%),var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
main{width:min(100%,480px);padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(22,34,55,.96),rgba(13,20,34,.98));box-shadow:0 28px 90px #0008}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;color:var(--muted);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}.brand img{width:38px;height:38px;object-fit:contain;border-radius:10px}
.eyebrow{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2rem,7vw,2.7rem);line-height:1.05;letter-spacing:-.05em;margin:9px 0 12px}.intro{color:var(--muted);margin:0 0 28px}
label{display:block;font-size:.88rem;font-weight:700;margin:0 0 9px}input{width:100%;padding:16px 17px;border:1px solid #344965;border-radius:12px;background:#080f1d;color:var(--text);font:700 1.05rem ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #72b7ff22}
button{width:100%;margin-top:13px;padding:15px;border:0;border-radius:12px;background:linear-gradient(110deg,#4c9bea,#8068df);color:white;font-weight:800;font-size:1rem;cursor:pointer}button:hover{filter:brightness(1.1)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#feedback{min-height:26px;margin:13px 0 0;font-size:.9rem;color:#ff9e9e}#feedback.ok{color:var(--good)}
footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}a{color:var(--accent);text-decoration:none;font-size:.88rem}a:hover{text-decoration:underline}.note{margin-top:20px;color:#7789a3;font-size:.76rem}
</style>
</head>
<body><main>
<div class="brand"><img src="logo.png" alt="" onerror="this.hidden=true"> SEVCON · TOOLS</div>
<div class="eyebrow">Area sperimentale</div>
<h1>Accesso test</h1>
<p class="intro">Inserisci il codice associato all'area che vuoi aprire.</p>
<form id="access-form">
<label for="access-code">Codice di accesso</label>
<input id="access-code" name="code" type="text" maxlength="15" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ES. ABACO1" required>
<button type="submit">Apri area <span aria-hidden="true">↗</span></button>
<p id="feedback" role="status" aria-live="polite"></p>
</form>
<footer><a href="index.html">← Homepage test</a><a href="codici-test.html">Elenco codici</a></footer>
<p class="note">Questo è un sistema di instradamento client-side: i codici e le destinazioni sono leggibili nel sorgente e non costituiscono una protezione di sicurezza.</p>
</main>
<script>
const TEST_CODES = {
  "ABACO1": "abaco/",
  "MISURA1": "misuratore-blocchi/",
  "RIFOR1": "futuro/rifornimenti/"
};
const form=document.getElementById("access-form");
const input=document.getElementById("access-code");
const feedback=document.getElementById("feedback");
input.addEventListener("input",()=>{input.value=input.value.replace(/[^a-z0-9]/gi,"").toUpperCase();feedback.textContent="";feedback.className="";});
form.addEventListener("submit",event=>{
  event.preventDefault();
  const destination=TEST_CODES[input.value.trim()];
  if(!destination){feedback.textContent="Codice non riconosciuto. Controlla e riprova.";feedback.className="";input.select();return;}
  feedback.textContent="Codice valido. Apertura dell'area…";feedback.className="ok";
  window.location.assign(destination);
});
input.focus();
</script>
</body></html>
