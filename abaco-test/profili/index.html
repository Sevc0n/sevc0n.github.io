<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione Profili | Sevcon Tools</title><link rel="icon" href="../logo.png"><style>
:root{color-scheme:dark;--line:#ffffff20;--text:#edf3f3;--muted:#9aadb5;--cyan:#72c6c0;--lime:#c5d98b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#1c3b42,transparent 40rem),#0b1117;color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}.shell{width:min(1000px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}a{color:var(--cyan);text-decoration:none}.nav{display:flex;gap:16px}.hero{padding:30px 0 18px}.hero h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}.hero p,.meta{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:16px;align-items:start}.panel{background:linear-gradient(145deg,#1a2933,#111a22);border:1px solid var(--line);border-radius:15px;padding:20px}.panel h2{margin:0 0 14px;font-size:1.15rem}label{display:block;margin:12px 0 5px;color:#c7d4d8;font-size:.85rem}input,select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:#0b151d;color:var(--text);font:inherit}button{border:1px solid #72c6c077;background:#24413f;color:#e3f7f0;padding:9px 12px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#172630;color:var(--muted);border-color:var(--line)}.danger{background:#4a2528;border-color:#a34f56;color:#ffdfe0}.actions,.profile-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.feedback{min-height:1.5em;color:var(--lime);font-size:.85rem}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{color:var(--muted);font-size:.8rem}.profile{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.profile:last-child{border:0}.profile-main{flex:1;min-width:0}.profile-name{font-weight:800;overflow-wrap:anywhere}.meta{font-size:.82rem;margin-top:3px}.tier-badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:.72rem;font-weight:800;margin-top:7px}.tier-novizio{background:linear-gradient(135deg,#eef2f7,#a0aec0 35%,#6b7687 65%,#eef2f7);color:#1f2937}.tier-avanzato{background:linear-gradient(135deg,#ffd9b0,#ed8936 35%,#a14f10 65%,#ffd9b0);color:#fff9f3}.tier-esperto{background:linear-gradient(135deg,#d6dce6,#718096 35%,#3f4a5a 65%,#d6dce6);color:#f7f9fb}.tier-custode{background:linear-gradient(135deg,#f6e27a,#d69e2e 35%,#8c6b1a 65%,#f6e27a);color:#fffdf4}.tier-maestro{background:linear-gradient(135deg,#d6ecff,#4299e1 35%,#1e5f9a 65%,#d6ecff);color:#f7fcff}.tier-granmaestro{background:linear-gradient(135deg,#c7ffe6,#10b981 35%,#0a7a56 65%,#c7ffe6);color:#f4fff9}.profile-actions button{font-size:.78rem}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}@media(max-width:760px){.layout{grid-template-columns:1fr}.top{flex-direction:column}.profile{align-items:flex-start;flex-wrap:wrap}}
</style></head><body><div class="shell"><header class="top"><a href="../"><b>SEVCON TOOLS</b></a><nav class="nav"><a href="../">Homepage</a><a href="../abaco/">Abaco Divisore</a></nav></header><main><section class="hero"><div style="color:var(--cyan);font-size:.75rem;font-weight:800;letter-spacing:.14em">ARCHIVIO CONDIVISO</div><h1>Gestione Profili</h1><p>Crea e gestisci i membri del gruppo. L'archivio è condiviso tra gli strumenti Sevcon aperti su questo stesso browser.</p></section><div class="layout"><section class="panel"><h2 id="form-title">Crea un profilo</h2><form id="form"><label for="name">Nome del personaggio</label><input id="name" maxlength="60" required placeholder="Es. Andrius"><label for="role">Ruolo in Abisso</label><select id="role"></select><label for="tier">Maestranza</label><select id="tier"></select><label for="status">Stato</label><select id="status"></select><div class="actions"><button id="submit" type="submit">Crea profilo</button><button id="cancel" type="button" class="secondary" hidden>Annulla</button></div><p id="feedback" class="feedback" role="status"></p></form></section><section class="panel"><div class="toolbar"><h2 style="margin:0">Membri</h2><span id="count" class="count">0 profili</span></div><input id="search" type="search" placeholder="Cerca nome, ruolo, maestranza o stato"><div id="list" style="margin-top:8px"></div></section></div></main></div><script src="../assets/profiles.js"></script><script>
(()=>{const api=window.SevconProfiles,form=document.getElementById('form'),name=document.getElementById('name'),role=document.getElementById('role'),tier=document.getElementById('tier'),status=document.getElementById('status'),list=document.getElementById('list'),feedback=document.getElementById('feedback');let editing=null;function options(el,values){el.replaceChildren(...values.map(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;return o;}));}options(role,api.roles);options(tier,api.tiers);options(status,api.statuses);function reset(){editing=null;form.reset();role.value=api.roles[0];tier.value=api.tiers[0];status.value=api.statuses[0];document.getElementById('form-title').textContent='Crea un profilo';document.getElementById('submit').textContent='Crea profilo';document.getElementById('cancel').hidden=true;}function render(){const all=api.getAll().sort((a,b)=>a.name.localeCompare(b.name,'it')),q=document.getElementById('search').value.trim().toLocaleLowerCase('it'),shown=all.filter(p=>[p.name,p.role,p.tier,p.status].some(v=>v.toLocaleLowerCase('it').includes(q)));document.getElementById('count').textContent=all.length+' profili';list.replaceChildren();if(!shown.length){const e=document.createElement('div');e.className='empty';e.textContent=all.length?'Nessun risultato.':'Nessun profilo creato.';list.append(e);return;}shown.forEach(p=>{const row=document.createElement('article');row.className='profile';const main=document.createElement('div');main.className='profile-main';const n=document.createElement('div');n.className='profile-name';n.textContent=p.name;const m=document.createElement('div');m.className='meta';m.textContent=p.role+' · '+p.status;const t=document.createElement('span');t.className='tier-badge tier-'+p.tier.toLowerCase().replaceAll(' ','');t.textContent=p.tier;main.append(n,m,t);const actions=document.createElement('div');actions.className='profile-actions';const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='Modifica';edit.onclick=()=>{editing=p.id;name.value=p.name;role.value=p.role;tier.value=p.tier;status.value=p.status;document.getElementById('form-title').textContent='Modifica profilo';document.getElementById('submit').textContent='Salva modifiche';document.getElementById('cancel').hidden=false;name.focus();};const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Elimina';del.onclick=()=>{if(confirm('Eliminare definitivamente il profilo di '+p.name+'?')){try{api.remove(p.id);if(editing===p.id)reset();feedback.textContent='Profilo eliminato.';render();}catch(e){feedback.textContent=e.message;}}};actions.append(edit,del);row.append(main,actions);list.append(row);});}form.onsubmit=e=>{e.preventDefault();try{api.save({id:editing,name:name.value,role:role.value,tier:tier.value,status:status.value});feedback.textContent=editing?'Modifiche salvate.':'Profilo creato.';reset();render();}catch(e){feedback.textContent=e.message;}};document.getElementById('cancel').onclick=reset;document.getElementById('search').oninput=render;window.addEventListener('storage',e=>{if(e.key===api.storageKey)render();});render();})();
</script></body></html>
